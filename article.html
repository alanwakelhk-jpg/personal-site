<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="文章详情" />
  <meta name="theme-color" content="#05070f" />
  <title>文章详情 · 个人资源站</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%2300e5ff'/><circle cx='50' cy='50' r='22' fill='%2305070f'/></svg>" />
</head>
<body class="article-page">
  <canvas id="particle-canvas" aria-hidden="true"></canvas>
  <div class="bg-layer" aria-hidden="true"></div>

  <header class="site-header" id="siteHeader">
    <div class="header-inner">
      <a class="brand" href="./index.html">
        <span class="brand-dot"></span>
        <span class="brand-text" id="brandText">个人资源站</span>
      </a>
      <nav class="nav" id="mainNav">
        <a href="./index.html" class="nav-link">返回首页</a>
        <a href="./index.html#articles" class="nav-link">全部文章</a>
        <a href="./index.html#messages" class="nav-link">留言板</a>
      </nav>
      <div class="header-actions">
        <button id="themeToggle" class="icon-btn" type="button" aria-label="切换深色/浅色模式">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="article-main">
    <article class="article-detail glass" id="articleDetail">
      <div class="article-loading">正在加载文章…</div>
    </article>

    <div class="article-nav">
      <a class="btn ghost" href="./index.html#articles">← 返回文章列表</a>
    </div>
  </main>

  <footer class="site-footer">
    <p><span id="footerName">个人资源站</span> · 基于 <a href="https://pages.cloudflare.com/" target="_blank" rel="noopener noreferrer">Cloudflare Pages</a> 构建 · <span id="year"></span></p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./js/article-page.js"></script>
</body>
</html>
