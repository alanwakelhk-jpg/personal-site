# ============================================================
# Cloudflare Pages 项目配置（本地开发 / CLI 部署用）
# 若你走 GitHub 自动部署，这份文件主要用于 `npm run dev` 与 wrangler 命令
# 【可替换】name / database_name / database_id / vars
# ============================================================

name = "personal-resource-site"
compatibility_date = "2025-01-01"
pages_build_output_dir = "."

# ---------- D1 数据库绑定 ----------
[[d1_databases]]
binding = "DB"                                  # 代码里通过 env.DB 访问，不要改名
database_name = "personal-site-db"              # 【可替换】D1 数据库名称
database_id = "f65fa869-d99f-4789-af72-4274a7a1f64f" # 已创建：personal-site-db

# ---------- 普通环境变量（非敏感）----------
# 敏感变量（如 ADMIN_TOKEN）请到 Cloudflare Dashboard -> Pages -> Settings -> Environment variables 配置
[vars]
SITE_NAME = "个人资源站"
ALLOWED_ORIGIN = "*"
# redeploy trigger: ADMIN_TOKEN env var configured on Pages project
